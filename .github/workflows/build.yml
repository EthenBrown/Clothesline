name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

# 打 tag 时要创建 Release 并上传 exe，必须显式授予写权限
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish self-contained single file
        run: >
          dotnet publish Clothesline.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o out

      - uses: actions/upload-artifact@v4
        with:
          name: Clothesline-win-x64
          path: out/Clothesline.exe
          if-no-files-found: error

      - name: Attach exe to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/Clothesline.exe
          body: |
            下载 `Clothesline.exe` 双击即可运行（自包含，无需安装 .NET）。

            ## 本版更新
            - 修复一次截图重复挂出 2~4 张（剪贴板防抖 + 原图尺寸与内容指纹判重）
            - 顶部触发区域可调，空白处点击穿透，不再挡住窗口的最小化 / 最大化 / 关闭
            - 新增「一键清空」按钮；修复单张图片偶尔删不掉
            - 修复露头后不自动收起、微风动画后图片歪斜

            Clothesline 是 [Tendedero](https://github.com/alejandrobujan/tendedero)（macOS，作者 Alejandro Buján）的 Windows 重写版，交互设计与功能定义均致敬原作；名称与图标为另行创作。
